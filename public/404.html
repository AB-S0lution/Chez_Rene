<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Cette salle n'existe pas | Chez René</title>
    <link rel="icon" type="image/svg+xml" href="/Chez_Rene/favicon.svg" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; color: #faf5ef; font-family: Georgia, "Times New Roman", serif; background: radial-gradient(90% 70% at 50% 20%, rgb(72 104 152 / .4), transparent 65%), linear-gradient(160deg, #2f3e63, #101018); }
      main { max-width: 34rem; }
      .plaque { display: inline-flex; flex-direction: column; padding: 10px 26px 12px; background: #123f8f; color: #fff; border: 3px solid #fff; outline: 3px solid #123f8f; outline-offset: -8px; border-radius: 8px; font: 700 .8rem/1.3 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 28px; }
      .plaque b { font-size: 1.2rem; letter-spacing: .12em; }
      .door { width: 104px; height: 156px; margin: 0 auto 26px; border: 3px solid #c9a55a; border-radius: 52px 52px 0 0; background: #181828; position: relative; }
      .door::after { content: ""; position: absolute; right: 18px; top: 82px; width: 10px; height: 10px; border-radius: 50%; background: #c8743f; }
      h1 { font-size: clamp(2rem, 7vw, 3rem); font-weight: 500; margin: 0 0 12px; line-height: 1.12; }
      p { color: #d3dbee; margin: 0 0 26px; line-height: 1.6; }
      a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 999px; background: #c8743f; color: #101018; font: 600 .85rem system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; }
      a.btn:focus-visible { outline: 2px solid #8fa8d6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="plaque" aria-hidden="true">Boulevard<b>René Laennec</b></span>
      <div class="door" aria-hidden="true"></div>
      <h1>Cette salle n'existe pas.</h1>
      <p>La porte donne sur un mur. Revenez au comptoir : la carte, le bar et la cave sont par là.</p>
      <a class="btn" href="/Chez_Rene/">Retour au comptoir</a>
    </main>
  </body>
</html>
