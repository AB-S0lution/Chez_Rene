<!doctype html>
<html lang="fr" data-theme="soir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nos cartes : midi et soir | Chez René</title>
    <meta name="description" content="Formule du midi à 12, 16,50 ou 21 €, carte du soir de 25 à 30 € les trois plats, ardoise qui change chaque semaine. Chez René, Rennes." />
    <link rel="canonical" href="https://ab-s0lution.github.io/Chez_Rene/cartes/" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101018" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF5EF" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Chez René" />
    <meta property="og:title" content="Nos cartes : midi et soir | Chez René" />
    <meta property="og:description" content="Formule du midi à 12, 16,50 ou 21 €, carte du soir de 25 à 30 € les trois plats, ardoise qui change chaque semaine. Chez René, Rennes." />
    <meta property="og:url" content="https://ab-s0lution.github.io/Chez_Rene/cartes/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="{{base}}favicon.svg" />
    <script>
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('chezrene-theme'); } catch (e) {}
        if (t !== 'midi' && t !== 'soir') {
          var h = new Date().getHours(), dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          t = dark ? 'soir' : (h >= 6 && h < 17 ? 'midi' : 'soir');
        }
        d.setAttribute('data-theme', t);
        d.classList.add('js');
        if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) d.classList.add('js-motion');
        // Fail-safe: if the page module never boots, drop the hidden initial states so content shows.
        setTimeout(function () { if (!d.classList.contains('motion-ready')) d.classList.remove('js-motion'); }, 4000);
      })();
    </script>
  </head>
  <body data-page="cartes" data-depth="1">
    <!--HEADER-->
    <main id="main" tabindex="-1"></main>
    <!--FOOTER-->
    <script type="module" src="/src/pages/cartes.ts"></script>
  </body>
</html>
