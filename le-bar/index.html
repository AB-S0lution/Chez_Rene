<!doctype html>
<html lang="fr" data-theme="soir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Le bar et l'espace cave | Chez René</title>
    <meta name="description" content="Cocktails classiques et signature, mocktails, gin & tonic, bières artisanales et espace cave en libre-service. Le bar de Chez René, Rennes." />
    <link rel="canonical" href="https://ab-s0lution.github.io/Chez_Rene/le-bar/" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101018" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF5EF" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Chez René" />
    <meta property="og:title" content="Le bar et l'espace cave | Chez René" />
    <meta property="og:description" content="Cocktails classiques et signature, mocktails, gin & tonic, bières artisanales et espace cave en libre-service. Le bar de Chez René, Rennes." />
    <meta property="og:url" content="https://ab-s0lution.github.io/Chez_Rene/le-bar/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="{{base}}favicon.svg" />
    <script>
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('chezrene-theme'); } catch (e) {}
        if (t !== 'midi' && t !== 'soir') {
          var h = new Date().getHours(), dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          t = dark ? 'soir' : (h >= 6 && h < 17 ? 'midi' : 'soir');
        }
        d.setAttribute('data-theme', t);
        d.classList.add('js');
        if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) d.classList.add('js-motion');
      })();
    </script>
  </head>
  <body data-page="bar" data-depth="1">
    <!--HEADER-->
    <main id="main" tabindex="-1"></main>
    <!--FOOTER-->
    <script type="module" src="/src/pages/bar.ts"></script>
  </body>
</html>
